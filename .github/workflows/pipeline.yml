name: Market Intelligence ETL Pipeline

on:
  schedule:
    # Corre cada 7 días a las 02:00 AM UTC (Domingos a las 02:00 AM)
    - cron: '0 2 * * 0'
  workflow_dispatch: # Permite la ejecución manual desde la interfaz de GitHub Actions

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Instalar Microsoft ODBC Driver 18
        run: |
          sudo rm -f /usr/share/keyrings/microsoft-prod.gpg
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          
          UBUNTU_VERSION=$(lsb_release -rs)
          echo "deb [arch=amd64,arm64,armhf signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/${UBUNTU_VERSION}/prod $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/mssql-release.list
          
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Pipeline ETL
        id: run_pipeline
        env:
          # SerpAPI
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}

          # Pipeline Settings
          LOG_LEVEL: "INFO"
          MAX_RESULTS_PER_SEARCH: "10"
          RAW_DATA_PATH: "data/1_raw"

          # AZURE SQL / API
          API_URL: ${{ secrets.API_URL }}
          MY_API_SECRET_KEY: ${{ secrets.MY_API_SECRET_KEY }}

          # DB Connector
          DB_SERVER: ${{ secrets.DB_SERVER }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PORT: "1433"
          DB_DRIVER: "ODBC Driver 18 for SQL Server"
        run: |
          # Redirigir la salida a la consola y registrarla en pipeline_execution.log
          python main.py 2>&1 | tee pipeline_execution.log

      - name: Enviar reporte por correo (Éxito)
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "✅ [ÉXITO] Pipeline ETL Market Intelligence - Ejecución Completada"
          to: ${{ secrets.GMAIL_RECIPIENT }}
          from: "GitHub Actions Market Intelligence <${{ secrets.GMAIL_USER }}>"
          body: |
            El pipeline ETL de Market Intelligence Data Warehouse se ha ejecutado con éxito.

            Detalles de la ejecución:
            - Repositorio: ${{ github.repository }}
            - Rama: ${{ github.ref_name }}
            - Ejecutado por: ${{ github.actor }}
            - Evento: ${{ github.event_name }}

            Consulta el log completo adjunto en este correo.
          attachments: pipeline_execution.log

      - name: Enviar reporte por correo (Fallo)
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "❌ [ERROR] Pipeline ETL Market Intelligence - Fallo en la Ejecución"
          to: ${{ secrets.GMAIL_RECIPIENT }}
          from: "GitHub Actions Market Intelligence <${{ secrets.GMAIL_USER }}>"
          body: |
            Ocurrió un error durante la ejecución del pipeline ETL.

            Detalles del fallo:
            - Repositorio: ${{ github.repository }}
            - Rama: ${{ github.ref_name }}
            - Ejecutado por: ${{ github.actor }}
            - Evento: ${{ github.event_name }}

            Revisa el archivo adjunto 'pipeline_execution.log' para analizar la causa del problema.
          attachments: pipeline_execution.log